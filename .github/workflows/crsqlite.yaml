name: Download crsqlite

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Crsqlite tag to download artifacts"
        required: true

      branch:
        description: "Target branch for commit"
        required: true

jobs:
  download:
    # Keep libclang 14 available for CR-SQLite's old bindgen.
    runs-on: ubuntu-22.04
    env:
      REPO: superfly
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checks out repository to runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download crsqlite
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ -z "$INPUT_BRANCH" || "$INPUT_BRANCH" == "main" ]]; then
              echo "Please specify a different commit branch, main is not allowed"
              exit 1
          fi

          ./.buildkite/download-crsqlite.sh

      - name: Set up ARMv7 build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-linux-gnueabihf libc6-dev-armhf-cross libclang-14-dev
          rustup toolchain install nightly-2023-10-05 --profile minimal \
            --target armv7-unknown-linux-gnueabihf

      - name: Build crsqlite for ARMv7
        run: ./.buildkite/build-crsqlite-armv7.sh

      - uses: EndBug/add-and-commit@v9
        with:
          add: crates/corro-types
          new_branch: "${{ inputs.branch }}"
          message: "Update crsqlite to ${{ inputs.tag }}"
          push: true
